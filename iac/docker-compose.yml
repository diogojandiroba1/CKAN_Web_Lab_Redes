version: '3.8'

services:
  # Servidor 2: SGBD Relacional e Espacial
  postgis_db:
    image: postgis/postgis:16-3.4
    container_name: ngw_postgis
    restart: always
    environment:
      POSTGRES_DB: nextgisweb_db
      POSTGRES_USER: nextgis_admin
      POSTGRES_PASSWORD: SecretPostgisPassword2026!
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - internal_gis_net

  # Fila de Mensagens e Cache para Processamento Assincrono
  redis_cache:
    image: redis:7.2-alpine
    container_name: ngw_redis
    restart: always
    networks:
      - internal_gis_net

  # Servidor 1: Nucleo da Aplicacao NextGIS Web
  nextgisweb:
    image: nextgis/nextgisweb:latest
    container_name: ngw_core
    restart: always
    depends_on:
      - postgis_db
      - redis_cache
    environment:
      NGW_DB_HOST: postgis_db
      NGW_DB_PORT: 5432
      NGW_DB_NAME: nextgisweb_db
      NGW_DB_USER: nextgis_admin
      NGW_DB_PASSWORD: SecretPostgisPassword2026!
      NGW_REDIS_URL: redis://redis_cache:6379/0
    volumes:
      - nextgis_filestore:/opt/nextgisweb/filestore
    networks:
      - internal_gis_net
      - dmz_net

  # Proxy Reverso e Terminacao HTTP
  nginx_proxy:
    image: nginx:alpine
    container_name: ngw_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - nextgisweb
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - dmz_net

volumes:
  postgis_data:
    driver: local
  nextgis_filestore:
    driver: local

networks:
  internal_gis_net:
    driver: bridge
  dmz_net:
    driver: bridge
