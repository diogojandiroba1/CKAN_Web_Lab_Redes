services:
  # Servidor 2: SGBD Relacional e Espacial
  postgis_db:
    image: postgis/postgis:15-3.3
    container_name: ngw_postgis
    restart: always
    environment:
      POSTGRES_DB: nextgisweb_db
      POSTGRES_USER: nextgis_admin
      POSTGRES_PASSWORD: SecretPostgisPassword2026!
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - internal_gis_net

  # Fila de Mensagens e Cache para Processamento Assincrono
  redis_cache:
    image: redis:7.2-alpine
    container_name: ngw_redis
    restart: always
    networks:
      - internal_gis_net

  # Servidor 1: Nucleo da Aplicacao NextGIS Web Community Edition
  nextgisweb:
    image: nextgis/nextgisweb-ce:latest
    container_name: ngw_core
    command: server
    restart: always
    depends_on:
      - postgis_db
      - redis_cache
    environment:
      NEXTGISWEB__CORE__LOCALE__DEFAULT: "pt_BR"
      NEXTGISWEB__DATABASE__URL: "postgresql://nextgis_admin:SecretPostgisPassword2026!@postgis_db:5432/nextgisweb_db"
      NEXTGISWEB__REDIS__URL: "redis://redis_cache:6379/0"
    volumes:
      - nextgis_data:/opt/crater/data
      - nextgis_backup:/opt/crater/backup
    networks:
      - internal_gis_net
      - dmz_net

  # Proxy Reverso e Terminacao HTTP (Porta 80 e 443)
  nginx_proxy:
    image: nginx:alpine
    container_name: ngw_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - nextgisweb
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - dmz_net

volumes:
  postgis_data:
    driver: local
  nextgis_data:
    driver: local
  nextgis_backup:
    driver: local

networks:
  internal_gis_net:
    driver: bridge
  dmz_net:
    driver: bridge
