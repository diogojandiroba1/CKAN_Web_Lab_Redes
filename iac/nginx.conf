events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Limite para upload de datasets volumosos (CSVs hidrologicos, shapefiles compactados e GeoJSONs)
    client_max_body_size 100M;

    upstream ckan_upstream {
        server ckan:5000;
    }

    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://ckan_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 300s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            # Desativa buffering para uploads continuos
            proxy_request_buffering off;
        }

        # Cache de assets estaticos do CKAN
        location /base/ {
            proxy_pass http://ckan_upstream/base/;
            proxy_cache_valid 200 1d;
            expires 1d;
            add_header Cache-Control "public, no-transform";
        }
    }
}
