events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Limite maximo para upload de Shapefiles pesados e rasters GeoTIFF
    client_max_body_size 500M;

    upstream nextgis_upstream {
        server nextgisweb:8080;
    }

    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://nextgis_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 300s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Cache de elementos estaticos
        location /static/ {
            proxy_pass http://nextgis_upstream/static/;
            proxy_cache_valid 200 1d;
            expires 1d;
            add_header Cache-Control "public, no-transform";
        }
    }
}
