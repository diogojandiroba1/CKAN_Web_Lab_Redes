! ==============================================================================
! Script de Configuracao - Provedor de Internet / Backbone UFS (Simulador WAN)
! Projeto: Infraestrutura de Rede Local - Grupo de Pesquisa em Modelagem Hidrologica
! Instituicao: Universidade Federal de Sergipe (UFS)
! Dispositivo: ISP-UFS (Cisco 2911 / Roteador de Provedor WAN)
! ==============================================================================

enable
configure terminal
hostname ISP-UFS

! Interface WAN conectada ao router_border do laboratorio
interface GigabitEthernet0/0
 description ENLACE_WAN_LABORATORIO_UFS
 ip address 200.17.0.1 255.255.255.252
 no shutdown
 exit

! Interface Virtual Loopback simulando a Internet Publica e Servidor DNS
interface Loopback0
 description INTERNET_PUBLICA_DNS_GOOGLE
 ip address 8.8.8.8 255.255.255.255
 no shutdown
 exit

! Rota de retorno para a sub-rede publica alocada ao router_border
ip route 200.17.0.0 255.255.255.252 200.17.0.2

end
write memory
