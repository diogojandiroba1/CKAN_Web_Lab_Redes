! ==============================================================================
! Cisco IOS Configuration - router_interno (Cisco 2911)
! Projeto de Infraestrutura de Rede UFS - Grupo de Modelagem Hidrologica
! ==============================================================================

enable
configure terminal

hostname router_interno

service password-encryption
no ip domain-lookup

! Enlace P2P com router_border (Cisco ISR4321)
interface GigabitEthernet0/1
 description Enlace P2P com Firewall Cisco ASA 5506-X
 ip address 10.0.1.2 255.255.255.252
 no shutdown
 exit

! Interface Tronco 802.1Q conectada ao Switch de Distribuicao
interface GigabitEthernet0/0
 description Enlace Tronco 802.1Q para Switch de Distribuicao
 no ip address
 no shutdown
 exit

! Subinterface VLAN 10 - Gerencia de Ativos
interface GigabitEthernet0/0.10
 description Gateway VLAN 10 (Gerencia)
 encapsulation dot1Q 10
 ip address 192.168.10.1 255.255.255.0
 no shutdown
 exit

! Subinterface VLAN 20 - Servidores e DMZ (NextGIS / PostGIS / DHCP)
interface GigabitEthernet0/0.20
 description Gateway VLAN 20 (Servidores NextGIS, PostGIS e DHCP)
 encapsulation dot1Q 20
 ip address 192.168.20.1 255.255.255.0
 no shutdown
 exit

! Subinterface VLAN 30 - Estacoes dos Pesquisadores
interface GigabitEthernet0/0.30
 description Gateway VLAN 30 (Pesquisadores CT-09 e CT-12)
 encapsulation dot1Q 30
 ip address 192.168.30.1 255.255.255.0
 ip helper-address 192.168.20.30
 ip access-group ACL_PESQUISA_IN in
 no shutdown
 exit

! Subinterface VLAN 40 - Rede Sem Fio (Wi-Fi)
interface GigabitEthernet0/0.40
 description Gateway VLAN 40 (Rede Sem Fio Omada)
 encapsulation dot1Q 40
 ip address 192.168.40.1 255.255.255.0
 ip helper-address 192.168.20.30
 ip access-group ACL_WIFI_IN in
 no shutdown
 exit

! Rota Padrao de Saida direcionada ao Firewall ASA 5506-X
ip route 0.0.0.0 0.0.0.0 10.0.1.1

! Configuracao do Servidor DHCP para VLAN 30 (Pesquisa)
ip dhcp excluded-address 192.168.30.1 192.168.30.49
ip dhcp pool POOL_PESQUISA
 network 192.168.30.0 255.255.255.0
 default-router 192.168.30.1
 dns-server 8.8.8.8 1.1.1.1
 exit

! Configuracao do Servidor DHCP para VLAN 40 (Wi-Fi)
ip dhcp excluded-address 192.168.40.1 192.168.40.99
ip dhcp pool POOL_WIFI
 network 192.168.40.0 255.255.255.0
 default-router 192.168.40.1
 dns-server 8.8.8.8 1.1.1.1
 exit

! Listas de Controle de Acesso (ACLs Estendidas)
ip access-list extended ACL_PESQUISA_IN
 ! Permite solicitacao e concessao DHCP (BOOTP) para clientes locais
 permit udp any any eq bootpc
 permit udp any any eq bootps
 ! Permite acesso HTTP e HTTPS ao NextGIS Web
 permit tcp 192.168.30.0 0.0.255.255 host 192.168.20.10 eq 80
 permit tcp 192.168.30.0 0.0.255.255 host 192.168.20.10 eq 443
 ! Bloqueia conexao direta de estacoes a porta nativa do PostgreSQL
 deny tcp 192.168.30.0 0.0.255.255 host 192.168.20.20 eq 5432 log
 ! Permite SSH apenas da estacao do Administrador para gerencia
 permit tcp host 192.168.30.10 192.168.10.0 0.0.0.255 eq 22
 ! Bloqueia acesso da pesquisa a VLAN de gerencia
 deny ip 192.168.30.0 0.0.255.255 192.168.10.0 0.0.0.255
 ! Permite restante do trafego para internet e campus
 permit ip 192.168.30.0 0.0.255.255 any
 exit

ip access-list extended ACL_WIFI_IN
 ! Permite solicitacao e concessao DHCP (BOOTP) para clientes sem fio
 permit udp any any eq bootpc
 permit udp any any eq bootps
 permit tcp 192.168.40.0 0.0.255.255 host 192.168.20.10 eq 80
 permit tcp 192.168.40.0 0.0.255.255 host 192.168.20.10 eq 443
 deny ip 192.168.40.0 0.0.255.255 192.168.10.0 0.0.0.255
 deny ip 192.168.40.0 0.0.255.255 192.168.20.0 0.0.0.255
 deny ip 192.168.40.0 0.0.255.255 192.168.30.0 0.0.0.255
 permit ip 192.168.40.0 0.0.255.255 any
 exit

end
write memory
