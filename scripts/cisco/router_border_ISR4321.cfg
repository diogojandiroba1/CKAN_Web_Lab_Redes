! ==============================================================================
! Cisco IOS Configuration - router_border (Cisco ISR4321)
! Projeto de Infraestrutura de Rede UFS - Grupo de Modelagem Hidrologica
! ==============================================================================

enable
configure terminal

hostname router_border

! Configuracao de Seguranca Basica
service password-encryption
no ip domain-lookup
banner motd ^C
#################################################################
# ACESSO RESTRITO - UFS / CCET / REDE DE MODELAGEM HIDROLOGICA  #
# Conexoes nao autorizadas serao registradas e auditadas.       #
#################################################################
^C

! Interface de Transito P2P com Firewall Cisco ASA 5506-X
interface GigabitEthernet0/0/0
 description Conexao P2P com Firewall Cisco ASA 5506-X
 ip address 10.0.0.1 255.255.255.252
 ip nat inside
 no shutdown
 exit

! Interface WAN de Conexao com Backbone UFS / Internet
interface GigabitEthernet0/0/1
 description Enlace WAN UFS / Saida Internet
 ip address 200.17.0.2 255.255.255.252
 ip nat outside
 no shutdown
 exit

! Rota Padrao de Saida para a Internet
ip route 0.0.0.0 0.0.0.0 200.17.0.1

! Rotas Estaticas de Retorno (apontando para o ASA 5506-X em 10.0.0.2)
ip route 192.168.0.0 255.255.0.0 10.0.0.2
ip route 10.0.1.0 255.255.255.252 10.0.0.2

! Configuracao de Traducao de Enderecos (NAT/PAT)
ip access-list standard ACL_NAT
 permit 192.168.0.0 0.0.255.255
 exit

ip nat inside source list ACL_NAT interface GigabitEthernet0/0/1 overload

! Redirecionamento Estatico para Servico NextGIS Web (Porta 80 e 443)
ip nat inside source static tcp 192.168.20.10 80 200.17.0.2 80
ip nat inside source static tcp 192.168.20.10 443 200.17.0.2 443

! Configuracao das Linhas de Console e VTY (Acesso Administrativo)
line con 0
 password CiscoConsoleSecret2026!
 login
 exit

line vty 0 4
 transport input ssh
 password CiscoVtySecret2026!
 login
 exit

end
write memory
