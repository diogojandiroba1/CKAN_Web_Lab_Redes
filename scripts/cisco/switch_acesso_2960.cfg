! ==============================================================================
! Cisco IOS Configuration - switch_acesso (Cisco Catalyst 2960-24TT)
! Projeto de Infraestrutura de Rede UFS - Grupo de Modelagem Hidrologica
! ==============================================================================

enable
configure terminal

hostname switch_acesso_2960

service password-encryption
no ip domain-lookup

! Criacao das VLANs
vlan 10
 name GERENCIA
 exit

vlan 20
 name SERVIDORES_DMZ
 exit

vlan 30
 name PESQUISADORES
 exit

vlan 40
 name WIFI_VISITANTES
 exit

! Interface SVI de Gerencia
interface vlan 10
 description Interface de Gerenciamento do Switch
 ip address 192.168.10.2 255.255.255.0
 no shutdown
 exit

ip default-gateway 192.168.10.1

! Porta de Uplink Tronco para o Roteador Interno (Cisco 2911)
interface GigabitEthernet0/1
 description Uplink Tronco 802.1Q para router_interno
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40
 no shutdown
 exit

! Portas de Acesso para Estacoes dos Pesquisadores (VLAN 30)
interface range FastEthernet0/1 - 16
 description Portas de Acesso - Estacoes de Trabalho
 switchport mode access
 switchport access vlan 30
 spanning-tree portfast
 no shutdown
 exit

! Portas de Acesso para Servidores Locais (VLAN 20)
interface range FastEthernet0/17 - 20
 description Portas de Acesso - Servidores NextGIS e PostGIS
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 no shutdown
 exit

! Portas de Acesso para Access Points PoE (VLAN 40)
interface range FastEthernet0/21 - 24
 description Portas de Acesso - Access Points Omada
 switchport mode access
 switchport access vlan 40
 spanning-tree portfast
 no shutdown
 exit

end
write memory
