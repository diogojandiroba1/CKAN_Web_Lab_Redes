! ==============================================================================
! Script de Configuracao - Firewall Cisco ASA 5506-X
! Projeto: Infraestrutura de Rede Local - Grupo de Pesquisa em Modelagem Hidrologica
! Instituicao: Universidade Federal de Sergipe (UFS)
! Dispositivo: firewall_asa (Cisco ASA 5506-X)
! ==============================================================================

enable
configure terminal
hostname ASA-5506

! ------------------------------------------------------------------------------
! 1. Configuracao das Interfaces Físicas e Zonas de Seguranca
! ------------------------------------------------------------------------------
! Interface Externa (Outside) conectada ao router_border (g0/0/0)
interface GigabitEthernet1/1
 description CONEXAO_ROUTER_BORDER_WAN
 nameif outside
 security-level 0
 ip address 10.0.0.2 255.255.255.252
 no shutdown
 exit

! Interface Interna (Inside) conectada ao router_interno (g0/1)
interface GigabitEthernet1/2
 description CONEXAO_ROUTER_INTERNO_LAN
 nameif inside
 security-level 100
 ip address 10.0.1.1 255.255.255.252
 no shutdown
 exit

! Interfaces 1/3 a 1/8 permanecem em shutdown por padrao no ASA
! ------------------------------------------------------------------------------
! 2. Tabela de Roteamento Estático do Firewall
! ------------------------------------------------------------------------------
! Rota padrao para a Internet / WAN UFS apontando para o router_border
route outside 0.0.0.0 0.0.0.0 10.0.0.1 1

! Rota interna para as VLANs do Campus apontando para o router_interno
route inside 192.168.0.0 255.255.0.0 10.0.1.2 1

! ------------------------------------------------------------------------------
! 3. Politica de Inspecao de Estado (Modular Policy Framework - MPF)
! ------------------------------------------------------------------------------
! Permite a inspecao profunda e retorno automatico de requisicoes ICMP e HTTP
policy-map global_policy
 class inspection_default
  inspect icmp
  inspect icmp error
  inspect http
  inspect dns
 exit

service-policy global_policy global

! ------------------------------------------------------------------------------
! 4. Regras de Acesso Externo (ACL Outside)
! ------------------------------------------------------------------------------
! Permite mensagens de controle ICMP essenciais na interface externa
access-list OUTSIDE_IN extended permit icmp any any echo-reply
access-list OUTSIDE_IN extended permit icmp any any unreachable
access-list OUTSIDE_IN extended permit icmp any any time-exceeded
access-group OUTSIDE_IN in interface outside

end
write memory
